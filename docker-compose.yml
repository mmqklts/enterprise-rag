x-app-environment: &app-environment
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:-rag_dev_password}@postgres:5432/enterprise_rag
  HF_HOME: /models/huggingface
  SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  RERANKER_MODEL_PATH: /models/bge-reranker-base

x-app-volumes: &app-volumes
  - "./data/uploads:/app/data/uploads"
  - "${MODEL_DIR:-./models}:/models:ro"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d enterprise_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command:
      - /app/.venv/bin/celery
      - -A
      - enterprise_rag.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    env_file:
      - .env
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  qdrant_data:
  postgres_data:
