[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mmqklts", email = "2017751636@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jieba>=0.42.1",
    "openai>=3.14.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
enterprise-rag = "enterprise_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "modelscope>=1.40.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
