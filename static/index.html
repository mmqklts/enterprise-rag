<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业智能知识库</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f6f8;
      color: #172033;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    header {
      background: #102a43;
      color: #fff;
      padding: 24px max(20px, calc((100vw - 1200px) / 2));
    }
    header h1 { margin: 0 0 6px; font-size: 26px; }
    header p { margin: 0; color: #bcccdc; }
    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px 40px;
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(420px, 1.2fr);
      gap: 20px;
      align-items: start;
    }
    section {
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 20px;
    }
    h2 { margin: 0 0 16px; font-size: 19px; }
    input, textarea, button {
      width: 100%;
      font: inherit;
    }
    input, textarea {
      border: 1px solid #bcccdc;
      border-radius: 6px;
      padding: 11px;
      background: #fff;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      margin-top: 12px;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      background: #0b7285;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { min-height: 24px; margin-top: 12px; color: #52606d; }
    .error { color: #b42318; }
    .answer {
      margin-top: 18px;
      padding: 14px;
      border-left: 4px solid #0b7285;
      background: #f0fbfc;
      white-space: pre-wrap;
    }
    .source { padding: 12px 0; border-top: 1px solid #e5e7eb; }
    .source-title { font-weight: 700; margin-bottom: 6px; }
    .source-text { color: #52606d; line-height: 1.6; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>企业智能知识库</h1>
    <p>上传企业文档，基于检索结果获取带来源的答案。</p>
  </header>

  <main>
    <section>
      <h2>文档入库</h2>
      <input id="file" type="file" accept=".pdf,.md,.markdown,.txt">
      <button id="upload-button">上传并索引</button>
      <div id="upload-status" class="status"></div>
    </section>

    <section>
      <h2>知识库问答</h2>
      <textarea id="question" placeholder="请输入问题"></textarea>
      <button id="chat-button">提交问题</button>
      <div id="chat-status" class="status"></div>
      <div id="answer" class="answer" hidden></div>
      <div id="sources"></div>
    </section>
  </main>

  <script>
    const uploadButton = document.querySelector("#upload-button");
    const fileInput = document.querySelector("#file");
    const uploadStatus = document.querySelector("#upload-status");
    const chatButton = document.querySelector("#chat-button");
    const questionInput = document.querySelector("#question");
    const chatStatus = document.querySelector("#chat-status");
    const answerBox = document.querySelector("#answer");
    const sourcesBox = document.querySelector("#sources");

    async function readResponse(response) {
      const data = await response.json();
      if (!response.ok) {
        throw new Error(JSON.stringify(data.detail));
      }
      return data;
    }

    uploadButton.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        uploadStatus.textContent = "请先选择文件";
        uploadStatus.className = "status error";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      uploadButton.disabled = true;
      uploadStatus.className = "status";
      uploadStatus.textContent = "正在解析、切分并建立索引...";

      try {
        const response = await fetch("/documents/upload", {
          method: "POST",
          body: formData,
        });
        const data = await readResponse(response);
        uploadStatus.textContent =
          `索引完成：${data.filename}，${data.page_count} 页，${data.chunk_count} 个 chunk`;
      } catch (error) {
        uploadStatus.className = "status error";
        uploadStatus.textContent = `上传失败：${error.message}`;
      } finally {
        uploadButton.disabled = false;
      }
    });

    chatButton.addEventListener("click", async () => {
      const question = questionInput.value.trim();
      if (!question) {
        chatStatus.textContent = "请输入问题";
        chatStatus.className = "status error";
        return;
      }

      chatButton.disabled = true;
      chatStatus.className = "status";
      chatStatus.textContent = "正在检索并生成答案...";
      sourcesBox.replaceChildren();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, limit: 5 }),
        });
        const data = await readResponse(response);

        answerBox.hidden = false;
        answerBox.textContent = data.answer;
        chatStatus.textContent = `找到 ${data.sources.length} 条来源`;

        data.sources.forEach((source) => {
          const item = document.createElement("div");
          item.className = "source";

          const title = document.createElement("div");
          title.className = "source-title";
          title.textContent =
            `[${source.index}] ${source.filename}，第 ${source.page} 页，分数 ${source.score.toFixed(4)}`;

          const text = document.createElement("div");
          text.className = "source-text";
          text.textContent = source.text;

          item.append(title, text);
          sourcesBox.append(item);
        });
      } catch (error) {
        chatStatus.className = "status error";
        chatStatus.textContent = `请求失败：${error.message}`;
      } finally {
        chatButton.disabled = false;
      }
    });
  </script>
</body>
</html>
